<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>Nueva Factura</title>

  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/nueva_factura.css" />
</head>

<body class="page-body">

  <header class="topbar">
    <h1>Nueva Factura</h1>
    <a href="/facturas" class="btn btn-secondary">Volver</a>
  </header>

  <!-- Todo el contenido dentro de un solo <main> y un solo <form> -->
  <main class="content">
    <form id="factura-form">

      <!-- DATOS GENERALES -->
      <section class="card">
        <h2 class="section-title">Datos Generales</h2>

        <div class="grid-3">
          <div class="form-group">
            <label>Empresa</label>
            <select id="empresa">
              <option value="">Cargando...</option>
            </select>
          </div>

          <div class="form-group">
            <label>Establecimiento</label>
            <select id="establecimiento">
              <option value="">Seleccione empresa primero</option>
            </select>
          </div>

          <div class="form-group">
            <label>Punto Emisión</label>
            <select id="punto-emision">
              <option value="">Seleccione establecimiento primero</option>
            </select>
          </div>

          <div class="form-group" style="position: relative;">
            <label>Cliente (Buscar por Cédula/RUC)</label>
            <div style="display: flex; gap: 0.5rem; margin-bottom: 0.5rem;">
              <input id="identificacion-cliente" type="text" placeholder="Ej: 1712345678" autocomplete="off">
              <!-- <button type="button" id="btn-buscar-cliente" class="btn btn-primary btn-sm">Buscar</button> -->
            </div>

            <!-- Lista de resultados de búsqueda -->
            <ul id="lista-resultados-cliente" style="
                display: none;
                position: absolute;
                top: 70px;
                left: 0;
                right: 0;
                background: white;
                border: 1px solid var(--border-color);
                border-radius: var(--radius-md);
                box-shadow: var(--shadow-lg);
                list-style: none;
                padding: 0;
                margin: 0;
                z-index: 100;
                max-height: 200px;
                overflow-y: auto;
            "></ul>

            <input id="nombre-cliente" type="text" placeholder="Nombre del cliente" readonly
              style="background-color: #f1f5f9;">
            <input id="cliente-id" type="hidden">
            <div style="margin-top: 0.5rem; text-align: right;">
              <button type="button" id="btn-abrir-modal-cliente" class="btn-link" style="font-size: 0.85rem;">+ Crear
                Nuevo Cliente</button>
            </div>
          </div>

          <div class="form-group">
            <label>Fecha emisión</label>
            <input id="fecha-emision" type="date">
          </div>

          <div class="form-group">
            <label>Observación</label>
            <input id="observacion" type="text">
          </div>

          <div class="form-group">
            <label>Guía de Remisión</label>
            <input id="guia-remision" type="text" placeholder="001-001-000000123">
          </div>
        </div>
      </section>

      <!-- DETALLES -->
      <section class="card">
        <div class="section-header">
          <h2 class="section-title">Detalles</h2>
          <button type="button" id="btn-agregar-linea" class="btn btn-primary btn-sm">
            + Agregar línea
          </button>
        </div>

        <table class="table">
          <thead>
            <tr>
              <th>Producto</th>
              <th>Cant</th>
              <th>Precio</th>
              <th>Desc %</th>
              <th>IVA</th>
              <th>Total</th>
              <th></th>
            </tr>
          </thead>

          <tbody id="lineas-tbody">
            <tr class="linea">
              <td>
                <select class="prod">
                  <option value="">Seleccione producto...</option>
                </select>
              </td>
              <td><input class="cant" type="number" value="1" min="1"></td>
              <td><input class="precio" type="number" value="100.00" step="0.01"></td>
              <td><input class="desc" type="number" value="0" min="0" max="100" step="0.01"></td>
              <td>
                <select class="iva">
                  <option value="12">12%</option>
                  <option value="0">0%</option>
                </select>
              </td>
              <td><input class="total" type="text" value="112.00" disabled></td>
              <td>
                <button type="button" class="btn-small danger btn-eliminar-linea">X</button>
              </td>
            </tr>
          </tbody>
        </table>
      </section>

      <!-- PAGOS Y RESUMEN -->
      <section class="grid-2">

        <!-- PAGOS -->
        <div class="card">
          <h2 class="section-title">Pagos</h2>

          <div id="pagos-contenedor">
            <div class="grid-2 pago">
              <div class="form-group">
                <label>Forma de pago</label>
                <select class="forma-pago">
                  <option value="EFECTIVO">Efectivo</option>
                  <option value="TARJETA">Tarjeta</option>
                  <option value="TRANSFERENCIA">Transferencia</option>
                </select>
              </div>

              <div class="form-group">
                <label>Monto</label>
                <input class="monto-pago" type="number" value="168.00" step="0.01">
              </div>

              <div class="form-group">
                <label>Plazo</label>
                <input class="plazo-pago" type="number" value="0" min="0">
              </div>

              <div class="form-group">
                <label>Tiempo</label>
                <select class="unidad-tiempo-pago">
                  <option value="dias">Días</option>
                  <option value="meses">Meses</option>
                  <option value="anios">Años</option>
                </select>
              </div>
            </div>
          </div>

          <button type="button" id="btn-agregar-pago" class="btn btn-secondary btn-sm">
            + Agregar pago
          </button>
        </div>

        <!-- RESUMEN -->
        <div class="card">
          <h2 class="section-title">Resumen</h2>

          <div class="summary-row">
            <span>Subtotal</span>
            <span id="subtotal-text">$150.00</span>
          </div>
          <div class="summary-row">
            <span>Descuento</span>
            <span id="descuento-text">$0.00</span>
          </div>
          <div class="summary-row">
            <span>IVA</span>
            <span id="iva-text">$18.00</span>
          </div>
          <div class="summary-row total">
            <strong>Total</strong>
            <strong id="total-text">$168.00</strong>
          </div>
        </div>

      </section>

      <!-- BOTONES -->
      <div class="form-actions">
        <a href="/facturas" class="btn btn-secondary">Cancelar</a>
        <button type="button" id="btn-guardar" class="btn btn-primary">
          Guardar y Emitir
        </button>
      </div>

    </form>
  </main>

  <!-- MODAL CREAR CLIENTE -->
  <dialog id="modal-crear-cliente" style="
      border: none;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 2rem;
      max-width: 500px;
      width: 90%;
      backdrop-filter: blur(5px);
  ">
    <h2 style="margin-top: 0; color: var(--primary-color);">Nuevo Cliente</h2>
    <form id="form-crear-cliente-modal">
      <div class="form-group">
        <label>Tipo Identificación</label>
        <select id="modal-tipoIdentificacion" required>
          <option value="05">Cédula</option>
          <option value="04">RUC</option>
          <option value="06">Pasaporte</option>
        </select>
      </div>
      <div class="form-group">
        <label>Identificación</label>
        <input type="text" id="modal-identificacion" required maxlength="13">
      </div>
      <div class="form-group">
        <label>Nombre / Razón Social</label>
        <input type="text" id="modal-nombreRazonSocial" required maxlength="200">
      </div>
      <div class="form-group">
        <label>Dirección</label>
        <input type="text" id="modal-direccion" maxlength="300">
      </div>
      <div class="form-group">
        <label>Teléfono</label>
        <input type="tel" id="modal-telefono" maxlength="20">
      </div>
      <div class="form-group">
        <label>Correo</label>
        <input type="email" id="modal-correo" maxlength="150">
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem;">
        <button type="button" id="btn-cerrar-modal" class="btn btn-secondary">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  </dialog>

  <!-- JS (lo creamos/llenamos después) -->
  <script src="/js/nueva_factura.js"></script>

</body>

</html>
