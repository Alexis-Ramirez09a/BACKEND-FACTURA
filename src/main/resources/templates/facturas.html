<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Mis Facturas</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/facturas.css">
</head>

<body class="page-body">

  <header class="topbar">
    <h1>Sistema de Facturación</h1>
    <div class="actions">
      <span id="user-display">Usuario</span>
      <button id="btn-logout" class="btn btn-secondary btn-sm">Salir</button>
    </div>
  </header>

  <main class="content">
    <div class="page-header">
      <h2>Mis Facturas</h2>
      <div class="header-actions">
        <a href="/clientes" class="btn btn-secondary">Clientes</a>
        <a href="/productos" class="btn btn-secondary">Productos</a>
        <a href="/nueva-factura" class="btn btn-primary">+ Nueva Factura</a>
      </div>
    </div>

    <div class="card">
      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Fecha</th>
            <th>Cliente</th>
            <th>Total</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="facturas-tbody">
          <!-- Se llena con JS -->
          <tr>
            <td colspan="6" class="text-center">Cargando...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="/js/facturas.js"></script>
</body>

</html>
