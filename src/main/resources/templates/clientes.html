<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/facturas.css">
</head>

<body class="page-body">

    <header class="topbar">
        <h1>Sistema de Facturación</h1>
        <div class="actions">
            <span id="user-display">Usuario</span>
            <button id="btn-logout" class="btn btn-secondary btn-sm">Salir</button>
        </div>
    </header>

    <main class="content">
        <div class="page-header">
            <h2>Clientes</h2>
            <div class="header-actions">
                <a href="/facturas" class="btn btn-secondary">Volver a Facturas</a>
                <button onclick="descargarReporte()" class="btn btn-secondary">Exportar PDF</button>
                <a href="/clientes/nuevo" class="btn btn-primary">+ Nuevo Cliente</a>
            </div>
        </div>

        <div class="card">
            <table class="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Identificación</th>
                        <th>Nombre / Razón Social</th>
                        <th>Correo</th>
                        <th>Teléfono</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="clientes-tbody">
                    <!-- Se llena con JS -->
                    <tr>
                        <td colspan="6" class="text-center">Cargando...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="/js/clientes.js"></script>
</body>

</html>
