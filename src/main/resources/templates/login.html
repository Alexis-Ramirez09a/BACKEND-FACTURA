<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Login - Sistema de Facturación</title>

  <!-- CSS generales -->
  <link rel="stylesheet" href="/css/base.css" />
  <!-- CSS específico del login -->
  <link rel="stylesheet" href="/css/login.css" />
</head>
<body class="login-body">
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">SF</div>
        <h1>Sistema de Facturación</h1>
        <p class="login-subtitle">Inicia sesión para continuar</p>
      </div>

     <form class="login-form" id="login-form">
  <div class="form-group">
    <label for="username">Usuario</label>
    <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" />
  </div>

  <div class="form-group">
    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" />
  </div>

  <!-- Mensaje de error -->
  <p id="login-error" class="login-error" style="display:none;"></p>

  <div class="form-footer">
    <!-- IMPORTANTE: type="submit" ahora -->
    <button type="submit" class="btn btn-primary btn-full">
      Ingresar
    </button>
  </div>

  <p class="login-note">
    © 2025 - Sistema de Facturación
  </p>
</form>

<!-- Al final del body, antes de </body> -->
<script src="/js/login.js"></script>
    </div>
  </div>
</body>
</html>
